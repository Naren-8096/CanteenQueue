<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password – CanteenQueue</title>
  <meta name="description" content="Reset your CanteenQueue password"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body class="hero-bg">
  <div class="loading-overlay hidden" id="loading-overlay">
    <div class="loading-box"><div class="spinner"></div><p>Sending email…</p></div>
  </div>

  <div class="auth-page">
    <div class="card auth-card animate-fade-up">
      <div class="auth-logo">
        <a href="/" style="text-decoration:none;color:var(--text)"><h1>🍽️ Canteen<span style="color:var(--primary)">Queue</span></h1></a>
        <p style="margin-top:.5rem">Enter your email to receive a password reset link.</p>
      </div>

      <form id="forgotForm">
        <div style="display:flex;flex-direction:column;gap:1.25rem">
          <div class="input-group">
            <label for="email">Email Address</label>
            <input id="email" type="email" class="input" placeholder="you@college.edu" required/>
          </div>
          <div id="errorMsg" class="error-msg hidden"></div>
          <div id="successMsg" class="hidden" style="color: green; background: #e6f4ea; padding: 1rem; border-radius: var(--radius); text-align: center; border: 1px solid #bce2c6;"></div>
          <button type="submit" class="btn btn-primary btn-full btn-lg" id="submitBtn">Send Reset Link</button>
        </div>
      </form>

      <p class="text-center mt-3" style="font-size:.875rem"><a href="login.html" style="color:var(--text-muted)">← Back to Login</a></p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const errMsg = document.getElementById('errorMsg');
      const successMsg = document.getElementById('successMsg');
      const btn = document.getElementById('submitBtn');

      errMsg.classList.add('hidden');
      successMsg.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = 'Sending…';

      try {
        const res = await api.post('/auth/forgotpassword', { email });
        successMsg.textContent = 'Password reset email sent! Please check your inbox (or terminal loopback).';
        successMsg.classList.remove('hidden');
        btn.textContent = 'Email Sent';
      } catch (err) {
        errMsg.textContent = err.message;
        errMsg.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Send Reset Link';
      }
    });
  </script>
</body>
</html>
