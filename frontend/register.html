<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register – CanteenQueue</title>
  <meta name="description" content="Create your CanteenQueue account"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body class="hero-bg">
  <div class="loading-overlay hidden" id="loading-overlay">
    <div class="loading-box"><div class="spinner"></div><p>Creating account…</p></div>
  </div>

  <div class="auth-page">
    <div class="card auth-card animate-fade-up">
      <div class="auth-logo">
        <a href="/" style="text-decoration:none;color:var(--text)"><h1>🍽️ Canteen<span style="color:var(--primary)">Queue</span></h1></a>
        <p style="margin-top:.5rem">Create your account to start ordering.</p>
      </div>

      <!-- ROLE SELECTION -->
      <div id="roleSelection">
        <h3 class="text-center mb-3">I am a…</h3>
        <div class="grid-2" style="gap:1rem">
          <button class="card" style="cursor:pointer;text-align:center;border:2px solid var(--border);transition:var(--transition)" id="roleStudent" onclick="selectRole('student')">
            <div style="font-size:2.5rem">🎓</div>
            <h3>Student</h3>
            <p style="font-size:.85rem">Order food from the canteen</p>
          </button>
          <button class="card" style="cursor:pointer;text-align:center;border:2px solid var(--border);transition:var(--transition)" id="roleStaff" onclick="selectRole('staff')">
            <div style="font-size:2.5rem">👨‍🍳</div>
            <h3>Staff</h3>
            <p style="font-size:.85rem">Manage orders & queue</p>
          </button>
        </div>
      </div>

      <!-- REGISTER FORM (hidden until role selected) -->
      <form id="registerForm" class="hidden" style="margin-top:1.5rem">
        <div id="selectedRoleBadge" style="text-align:center;margin-bottom:1.25rem"></div>
        <div style="display:flex;flex-direction:column;gap:1.25rem">
          <div class="input-group">
            <label for="name">Full Name</label>
            <input id="name" type="text" class="input" placeholder="John Doe" required/>
          </div>
          <div class="input-group">
            <label for="email">Email Address</label>
            <input id="email" type="email" class="input" placeholder="you@college.edu" required/>
          </div>

          <div class="input-group">
            <label for="password">Password</label>
            <div style="position: relative;">
              <input id="password" type="password" class="input" placeholder="Min. 6 characters" required style="padding-right: 2.5rem; width: 100%;"/>
              <button type="button" id="togglePasswordBtn" style="position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 1.1rem; padding: 0; display: flex; align-items: center; justify-content: center;">
                <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-eye"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
          </div>
          <div id="staffSecretGroup" class="input-group hidden">
            <label for="staffSecret">Staff Access Key</label>
            <input id="staffSecret" type="password" class="input" placeholder="Provided by Administration"/>
          </div>
          <input type="hidden" id="role"/>
          <div id="errorMsg" class="error-msg hidden"></div>
          <button type="submit" class="btn btn-primary btn-full btn-lg" id="registerBtn">Create Account</button>
          <button type="button" class="btn btn-ghost btn-full" onclick="backToRole()">← Change Role</button>
        </div>
      </form>

      <div class="auth-divider mt-3">— OR —</div>
      <p class="text-center" style="font-size:.9rem">Already have an account? <a href="login.html" style="color:var(--primary);font-weight:600">Login here</a></p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    redirectIfLoggedIn();

    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');
    if (togglePasswordBtn && passwordInput) {
      togglePasswordBtn.addEventListener('click', () => {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        if (type === 'password') {
          eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
        } else {
          eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
        }
      });
    }

    let selectedRole = null;
    const selectRole = (role) => {
      selectedRole = role;
      document.getElementById('role').value = role;
      document.getElementById('roleSelection').classList.add('hidden');
      document.getElementById('registerForm').classList.remove('hidden');
      document.getElementById('selectedRoleBadge').innerHTML =
        `<span class="badge badge-primary">${role === 'staff' ? '👨‍🍳 Staff' : '🎓 Student'}</span>`;
      // Highlight selected card
      document.getElementById(`role${role.charAt(0).toUpperCase()+role.slice(1)}`).style.borderColor = 'var(--primary)';
      
      if (role === 'staff') {
        document.getElementById('staffSecretGroup').classList.remove('hidden');
        document.getElementById('staffSecret').setAttribute('required', 'true');
      } else {
        document.getElementById('staffSecretGroup').classList.add('hidden');
        document.getElementById('staffSecret').removeAttribute('required');
      }
    };
    const backToRole = () => {
      document.getElementById('roleSelection').classList.remove('hidden');
      document.getElementById('registerForm').classList.add('hidden');
    };

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name     = document.getElementById('name').value.trim();
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const staffSecret = document.getElementById('staffSecret') ? document.getElementById('staffSecret').value.trim() : undefined;
      const role     = document.getElementById('role').value;
      const errMsg   = document.getElementById('errorMsg');
      const btn      = document.getElementById('registerBtn');

      errMsg.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = 'Creating Account…';
      showLoading();

      try {
        const payload = role === 'staff' ? { name, email, password, role, staffSecret } : { name, email, password, role };
        const res = await api.post('/auth/register', payload);
        saveAuth(res.token, res.user);
        toast('Account created successfully!', 'success');
        setTimeout(() => {
          window.location.href = res.user.role === 'staff' ? '/staff-dashboard.html' : '/student-dashboard.html';
        }, 600);
      } catch (err) {
        errMsg.textContent = err.message;
        errMsg.classList.remove('hidden');
        hideLoading();
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
