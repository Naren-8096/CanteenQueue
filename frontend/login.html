<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login – CanteenQueue</title>
  <meta name="description" content="Login to your CanteenQueue account"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body class="hero-bg">
  <div class="loading-overlay hidden" id="loading-overlay">
    <div class="loading-box"><div class="spinner"></div><p>Logging in…</p></div>
  </div>

  <div class="auth-page">
    <div class="card auth-card animate-fade-up">
      <div class="auth-logo">
        <a href="/" style="text-decoration:none;color:var(--text)"><h1>🍽️ Canteen<span style="color:var(--primary)">Queue</span></h1></a>
        <p style="margin-top:.5rem">Sign in to your account</p>
      </div>

      <form id="loginForm">
        <div style="display:flex;flex-direction:column;gap:1.25rem">
          <div class="input-group">
            <label for="email">Email Address</label>
            <input id="email" type="email" class="input" placeholder="you@college.edu" autocomplete="email" required/>
          </div>
          <div class="input-group">
            <label for="password">Password</label>
            <div style="position: relative;">
              <input id="password" type="password" class="input" placeholder="••••••••" autocomplete="current-password" required style="padding-right: 2.5rem; width: 100%;"/>
              <button type="button" id="togglePasswordBtn" style="position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 1.1rem; padding: 0; display: flex; align-items: center; justify-content: center;">
                <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-eye"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
            <div style="text-align: right; margin-top: 0.5rem;">
              <a href="forgot-password.html" style="font-size: 0.85rem; color: var(--primary); text-decoration: none; font-weight: 500;">Forgot Password?</a>
            </div>
          </div>
          <div id="errorMsg" class="error-msg hidden"></div>
          <button type="submit" class="btn btn-primary btn-full btn-lg" id="loginBtn">Sign In</button>
        </div>
      </form>

      <div style="margin: 1.5rem 0; display: flex; align-items: center; gap: 1rem;">
        <div style="flex: 1; height: 1px; background: var(--border);"></div>
        <span style="color: var(--text-muted); font-size: 0.85rem; font-weight: 500;">OR</span>
        <div style="flex: 1; height: 1px; background: var(--border);"></div>
      </div>

      <a href="/api/auth/google" class="btn btn-full" style="display: flex; align-items: center; justify-content: center; gap: 0.75rem; background: #ffffff; color: #333; border: 1px solid var(--border); font-weight: 600; padding: 0.8rem 1.25rem; transition: all 0.3s ease; font-size: 0.95rem;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </a>

      <p class="text-center" style="font-size:.9rem; margin-top: 2rem;">Don't have an account? <a href="register.html" style="color:var(--primary); font-weight:600">Sign up</a></p>
      <p class="text-center mt-2" style="font-size:.875rem"><a href="/" style="color:var(--text-muted)">← Back to Home</a></p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    redirectIfLoggedIn();

    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');
    if (togglePasswordBtn && passwordInput) {
      togglePasswordBtn.addEventListener('click', () => {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        if (type === 'password') {
          eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
        } else {
          eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
        }
      });
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errMsg   = document.getElementById('errorMsg');
      const btn      = document.getElementById('loginBtn');

      errMsg.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = 'Signing in…';
      showLoading();

      try {
        const res = await api.post('/auth/login', { email, password });
        saveAuth(res.token, res.user);
        toast('Login successful! Redirecting…', 'success');
        setTimeout(() => {
          const destination = (res.user.role === 'admin' || res.user.role === 'staff')
            ? '/admin-dashboard.html'
            : '/customer-dashboard.html';
          window.location.href = destination;
        }, 500);
      } catch (err) {
        errMsg.textContent = err.message;
        errMsg.classList.remove('hidden');
        hideLoading();
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
