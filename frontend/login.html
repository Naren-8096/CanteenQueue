<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login – CanteenQueue</title>
  <meta name="description" content="Login to your CanteenQueue account"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body class="hero-bg">
  <div class="loading-overlay hidden" id="loading-overlay">
    <div class="loading-box"><div class="spinner"></div><p>Logging in…</p></div>
  </div>

  <div class="auth-page">
    <div class="card auth-card animate-fade-up">
      <div class="auth-logo">
        <a href="/" style="text-decoration:none;color:var(--text)"><h1>🍽️ Canteen<span style="color:var(--primary)">Queue</span></h1></a>
        <p style="margin-top:.5rem">Welcome back! Sign in to your account.</p>
      </div>

      <form id="loginForm">
        <div style="display:flex;flex-direction:column;gap:1.25rem">
          <div class="input-group">
            <label for="email">Email Address</label>
            <input id="email" type="email" class="input" placeholder="you@college.edu" autocomplete="email" required/>
          </div>
          <div class="input-group">
            <label for="password">Password</label>
            <div style="position: relative;">
              <input id="password" type="password" class="input" placeholder="••••••••" autocomplete="current-password" required style="padding-right: 2.5rem; width: 100%;"/>
              <button type="button" id="togglePasswordBtn" style="position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 1.1rem; padding: 0; display: flex; align-items: center; justify-content: center;">
                <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-eye"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
            <div style="text-align: right; margin-top: 0.5rem;">
              <a href="forgot-password.html" style="font-size: 0.85rem; color: var(--primary); text-decoration: none; font-weight: 500;">Forgot Password?</a>
            </div>
          </div>
          <div id="errorMsg" class="error-msg hidden"></div>
          <button type="submit" class="btn btn-primary btn-full btn-lg" id="loginBtn">Sign In</button>
        </div>
      </form>

      <p class="text-center" style="font-size:.9rem">Don't have an account? <a href="register.html" style="color:var(--primary); font-weight:600">Register here</a></p>
      <p class="text-center mt-2" style="font-size:.875rem"><a href="/" style="color:var(--text-muted)">← Back to Home</a></p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    redirectIfLoggedIn();

    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');
    if (togglePasswordBtn && passwordInput) {
      togglePasswordBtn.addEventListener('click', () => {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        if (type === 'password') {
          eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
        } else {
          eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
        }
      });
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errMsg   = document.getElementById('errorMsg');
      const btn      = document.getElementById('loginBtn');

      errMsg.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = 'Signing in…';
      showLoading();

      try {
        const res = await api.post('/auth/login', { email, password });
        saveAuth(res.token, res.user);
        toast('Login successful! Redirecting…', 'success');
        setTimeout(() => {
          window.location.href = res.user.role === 'staff' ? '/staff-dashboard.html' : '/student-dashboard.html';
        }, 500);
      } catch (err) {
        errMsg.textContent = err.message;
        errMsg.classList.remove('hidden');
        hideLoading();
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
