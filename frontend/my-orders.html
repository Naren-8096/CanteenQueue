<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Orders – CanteenQueue</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body {
      background-color: var(--background);
    }

    .page-header {
      background: var(--surface);
      padding: 2rem;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-light);
      margin-bottom: 2rem;
    }

    .page-header h2 {
      font-size: 2rem;
      margin-bottom: .4rem;
    }

    .page-header p {
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    .date-group {
      margin-bottom: 3rem;
    }

    .date-header {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--ink-dim);
      border-bottom: 2px dashed var(--border);
      padding-bottom: .5rem;
      margin-bottom: 1.5rem;
    }

    .order-card {
      background: var(--surface);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-light);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      transition: all var(--transition);
    }

    .order-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .order-token {
      background: var(--surface-bg);
      padding: .4rem 1rem;
      border-radius: var(--radius-full);
      font-weight: 800;
      font-size: 1.1rem;
      color: var(--ink);
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      gap: .5rem;
    }

    .order-time {
      font-size: .85rem;
      color: var(--ink-faint);
      font-weight: 600;
      margin-top: .4rem;
      display: block;
    }

    .order-status {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      font-size: .85rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .05em;
      padding: .4rem 1rem;
      border-radius: var(--radius-full);
    }

    /* Specific statuses */
    .status-active {
      background: rgba(14, 165, 233, 0.1);
      color: #0284c7;
      border: 1px solid rgba(14, 165, 233, 0.2);
    }

    .status-delivered {
      background: rgba(16, 185, 129, 0.1);
      color: #059669;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }

    .status-cancelled {
      background: rgba(239, 68, 68, 0.1);
      color: #dc2626;
      border: 1px solid rgba(239, 68, 68, 0.2);
    }

    .order-items {
      border-top: 1px solid var(--border-light);
      padding-top: 1rem;
      margin-top: 1rem;
    }

    .order-item-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: .5rem;
      font-size: .95rem;
      font-weight: 500;
    }

    .order-item-name {
      color: var(--ink);
    }

    .order-item-qty {
      color: var(--text-muted);
      font-size: .85rem;
    }

    .order-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px dashed var(--border);
      padding-top: 1rem;
      margin-top: 1rem;
    }

    .order-total {
      font-weight: 800;
      font-size: 1.25rem;
      color: var(--ink);
    }

    .no-orders {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--ink-dim);
    }

    .no-orders .icon {
      font-size: 4rem;
      opacity: .5;
      margin-bottom: 1rem;
    }
  </style>
</head>

<body>
  <div class="loading-overlay hidden" id="loading-overlay">
    <div class="loading-box">
      <div class="spinner"></div>
      <p>Fetching your orders…</p>
    </div>
  </div>

  <nav class="navbar">
    <a href="/" class="navbar-brand">🍽 Canteen<span>Queue</span></a>
    <div class="navbar-nav">
      <div class="greet-chip"
        style="padding:.4rem 1rem;background:var(--surface-bg);border:1px solid var(--border);border-radius:99px;font-size:.9rem;font-weight:700;">
        👋 <span id="userName">Customer</span></div>
      <a href="customer-dashboard.html" class="btn btn-ghost btn-sm" style="font-weight:700">+ New Order</a>
      <button onclick="logout()" class="btn btn-outline btn-sm" style="border-radius:99px">Logout</button>
    </div>
  </nav>

  <div style="max-width:900px; margin:2rem auto; padding: 0 1.5rem;">
    <div class="page-header">
      <h2>My Orders 🧾</h2>
      <p>Keep track of all your past and active orders.</p>
    </div>
     <div id="ordersContainer">
      <!-- Orders will be injected here -->
    </div>
  </div>

  <!-- Item Review Modal -->
  <div id="reviewModal" class="modal-overlay hidden">
    <div class="modal-content" style="max-width: 520px; max-height: 90vh; overflow-y: auto;">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom: 1.25rem;">
        <div>
          <h3 id="reviewItemTitle" style="font-size: 1.35rem; font-weight: 800; margin-bottom:.2rem;">Food Reviews</h3>
          <div id="reviewItemRatingHeader" style="font-size:.9rem; font-weight:700; color:#b45309;">⭐ 0.0 (0 reviews)</div>
        </div>
        <button onclick="closeItemReviewModal()" style="background:transparent; border:none; font-size:1.8rem; cursor:pointer; color:var(--ink-dim); line-height:1;">&times;</button>
      </div>

      <!-- Write Review Form -->
      <div style="background:var(--surface-bg); border:1px solid var(--border); border-radius:var(--radius-md); padding:1.25rem; margin-bottom:1.5rem;">
        <div style="font-weight:800; font-size:.95rem; margin-bottom:.5rem; color:var(--ink);">Rate & Review This Food Item</div>
        <form id="itemReviewForm" onsubmit="handleItemReviewSubmit(event)">
          <input type="hidden" id="reviewItemId" />
          <div style="margin-bottom:.75rem;">
            <label style="font-size:.82rem; font-weight:700; color:var(--ink-faint); margin-bottom:.3rem; display:block;">Your Rating</label>
            <div class="star-rating-select" id="starRatingSelect">
              <span data-star="1" onclick="setModalStarRating(1)">★</span>
              <span data-star="2" onclick="setModalStarRating(2)">★</span>
              <span data-star="3" onclick="setModalStarRating(3)">★</span>
              <span data-star="4" onclick="setModalStarRating(4)">★</span>
              <span data-star="5" onclick="setModalStarRating(5)">★</span>
            </div>
            <input type="hidden" id="modalRatingValue" value="5" />
          </div>
          <div class="input-group" style="margin-bottom:.75rem;">
            <label style="font-size:.82rem; font-weight:700; color:var(--ink-faint);">Your Feedback</label>
            <textarea id="modalReviewComment" class="input" rows="2" placeholder="Taste, portion size, hot & fresh? (optional)" style="font-size:.9rem; resize:vertical;"></textarea>
          </div>
          <button type="submit" class="btn btn-accent btn-sm btn-full" style="font-weight:700;">Submit Review ⭐</button>
        </form>
      </div>

      <!-- Existing Reviews List -->
      <div>
        <div style="font-weight:800; font-size:.95rem; margin-bottom:.75rem; color:var(--ink);">Customer Reviews</div>
        <div id="modalReviewsList">
          <div class="empty-state" style="padding:1.5rem;"><div class="icon">💬</div><p>Loading reviews…</p></div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const user = requireAuth('customer');
    if (user) document.getElementById('userName').textContent = user.name.split(' ')[0];

    const getStatusClass = (status) => {
      if (status === 'Delivered') return 'status-delivered';
      if (status === 'Cancelled') return 'status-cancelled';
      if (status === 'Preparing') return 'status-preparing';
      if (status === 'Ready for Pickup') return 'status-ready';
      return 'status-queue';
    };

    /* ── REVIEW MODAL HANDLERS ── */
    let currentModalStar = 5;

    const setModalStarRating = (star) => {
      currentModalStar = star;
      document.getElementById('modalRatingValue').value = star;
      document.querySelectorAll('#starRatingSelect span').forEach(el => {
        const s = Number(el.dataset.star);
        el.classList.toggle('selected', s <= star);
      });
    };

    const openItemReviewModal = async (itemId, itemName = 'Food Item') => {
      document.getElementById('reviewItemId').value = itemId;
      document.getElementById('modalReviewComment').value = '';
      document.getElementById('reviewItemTitle').textContent = `${itemName} Reviews`;
      setModalStarRating(5);

      document.getElementById('reviewModal').classList.remove('hidden');
      document.getElementById('modalReviewsList').innerHTML = '<div class="empty-state" style="padding:1.5rem;"><p>Loading reviews…</p></div>';

      try {
        const res = await api.get(`/menu/${itemId}/reviews`);
        renderModalReviewsList(res.data);
      } catch (err) {
        document.getElementById('modalReviewsList').innerHTML = `<p style="color:var(--danger);font-size:.9rem;padding:1rem;">Failed to load reviews.</p>`;
      }
    };

    const closeItemReviewModal = () => {
      document.getElementById('reviewModal').classList.add('hidden');
    };

    const renderModalReviewsList = (data) => {
      const listEl = document.getElementById('modalReviewsList');
      const reviews = data.reviews || [];

      if (data.average_rating !== undefined) {
        const avg = data.average_rating > 0 ? data.average_rating.toFixed(1) : 'New';
        const count = data.num_reviews || 0;
        document.getElementById('reviewItemRatingHeader').textContent = `⭐ ${avg} (${count} review${count === 1 ? '' : 's'})`;
      }

      if (!reviews.length) {
        listEl.innerHTML = `
          <div class="empty-state" style="padding:2rem 1rem; text-align:center;">
            <div class="icon" style="font-size:2rem; opacity:.6; margin-bottom:.5rem;">💬</div>
            <p style="font-size:.9rem; color:var(--ink-faint);">No reviews yet for this item. Be the first to share your thoughts!</p>
          </div>`;
        return;
      }

      listEl.innerHTML = reviews.map(r => {
        const stars = '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating);
        const dateStr = new Date(r.createdAt).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
        return `
          <div class="review-item-card" style="border-bottom:1px solid var(--border); padding-bottom:.75rem; margin-bottom:.75rem;">
            <div class="review-item-header" style="display:flex; justify-content:space-between; margin-bottom:.2rem;">
              <span class="review-author" style="font-weight:700; font-size:.85rem;">👤 ${r.user_name || 'Student'}</span>
              <span class="review-stars" style="color:#f59e0b; font-size:.8rem;">${stars}</span>
            </div>
            ${r.comment ? `<div class="review-comment" style="font-size:.9rem; color:var(--ink);">"${r.comment}"</div>` : ''}
            <div class="review-date" style="font-size:.75rem; color:var(--ink-faint); margin-top:.2rem;">${dateStr}</div>
          </div>`;
      }).join('');
    };

    const handleItemReviewSubmit = async (e) => {
      e.preventDefault();
      const itemId = document.getElementById('reviewItemId').value;
      const rating = Number(document.getElementById('modalRatingValue').value);
      const comment = document.getElementById('modalReviewComment').value.trim();

      try {
        const res = await api.post(`/menu/${itemId}/reviews`, { rating, comment });
        toast('Thank you! Review submitted.', 'success');
        renderModalReviewsList(res.data);
        document.getElementById('modalReviewComment').value = '';
      } catch (err) {
        toast(err.message, 'error');
      }
    };

    const renderOrders = (orders) => {
      const container = document.getElementById('ordersContainer');
      if (!orders || orders.length === 0) {
        container.innerHTML = `
          <div class="no-orders animate-fade-up">
            <div class="icon">🛒</div>
            <h3>No orders yet</h3>
            <p>You haven't placed any orders. Hungry?</p>
            <a href="customer-dashboard.html" class="btn btn-primary mt-2">Browse Menu</a>
          </div>`;
        return;
      }

      // Group by date
      const grouped = {};
      orders.forEach(order => {
        const d = new Date(order.createdAt);
        // Format: 'Monday, April 6, 2026'
        const dateStr = d.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        if (!grouped[dateStr]) grouped[dateStr] = [];
        grouped[dateStr].push(order);
      });

      let html = '';
      for (const [dateStr, dayOrders] of Object.entries(grouped)) {
        html += `<div class="date-group animate-fade-up">
                   <div class="date-header">${dateStr}</div>`;

        dayOrders.forEach(order => {
          const d = new Date(order.createdAt);
          const timeStr = d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
          const isDelivered = order.order_status === 'Delivered';
          const isDone = ['Delivered', 'Cancelled'].includes(order.order_status);

          const itemsHtml = order.items.map(item => `
            <div class="order-item-row" style="display:flex; align-items:center; justify-content:space-between; padding:.4rem 0;">
              <div>
                <span class="order-item-name">${item.item_name}</span> 
                <span class="order-item-qty">x${item.quantity}</span>
              </div>
              <div style="display:flex; align-items:center; gap:.75rem;">
                <span style="font-weight:700;">₹${item.price * item.quantity}</span>
                ${isDelivered ? `<button class="btn-review" style="padding:.2rem .6rem; font-size:.75rem;" onclick="openItemReviewModal('${item.item_id}', '${item.item_name}')">⭐ Review</button>` : ''}
              </div>
            </div>
          `).join('');

          html += `
            <div class="order-card">
              <div class="order-header">
                <div>
                  <div class="order-token">🎟️ #${order.token_number}</div>
                  <span class="order-time">${timeStr}</span>
                </div>
                <div class="order-status ${getStatusClass(order.order_status)}">${order.order_status}</div>
              </div>
              
              <div class="order-items">
                ${itemsHtml}
              </div>
              
              <div class="order-footer">
                <div class="order-total">Total: ₹${order.total_price}</div>
                ${!isDone ? `<a href="order-confirmation.html?order=${order._id}" class="btn btn-primary btn-sm">Live Status →</a>` : ''}
              </div>
            </div>
          `;
        });

        html += `</div>`;
      }

      container.innerHTML = html;
    };

    const fetchOrders = async () => {
      showLoading();
      try {
        const res = await api.get('/order/my-orders');
        renderOrders(res.data);
      } catch (err) {
        toast('Failed to load orders', 'error');
      } finally {
        hideLoading();
      }
    };

    fetchOrders();
  </script>
</body>

</html>
