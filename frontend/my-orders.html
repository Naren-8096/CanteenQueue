<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Orders – CanteenQueue</title>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    body { background-color: var(--background); }
    .page-header {
      background: var(--surface); padding: 2rem; border-radius: var(--radius-lg); 
      box-shadow: var(--shadow-sm); border: 1px solid var(--border-light);
      margin-bottom: 2rem; 
    }
    .page-header h2 { font-size: 2rem; margin-bottom: .4rem; }
    .page-header p { font-size: 1.05rem; font-weight: 500; color: var(--text-muted); }
    
    .date-group { margin-bottom: 3rem; }
    .date-header {
      font-size: 1.1rem; font-weight: 800; color: var(--ink-dim); 
      border-bottom: 2px dashed var(--border); padding-bottom: .5rem; margin-bottom: 1.5rem;
    }
    
    .order-card {
      background: var(--surface); border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm); border: 1px solid var(--border-light);
      padding: 1.5rem; margin-bottom: 1.5rem;
      transition: all var(--transition);
    }
    .order-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    
    .order-header {
      display: flex; justify-content: space-between; align-items: flex-start;
      margin-bottom: 1rem; flex-wrap: wrap; gap: 1rem;
    }
    .order-token {
      background: var(--surface-bg); padding: .4rem 1rem; border-radius: var(--radius-full);
      font-weight: 800; font-size: 1.1rem; color: var(--ink); border: 1px solid var(--border);
      display: inline-flex; align-items: center; gap: .5rem;
    }
    .order-time { font-size: .85rem; color: var(--ink-faint); font-weight: 600; margin-top: .4rem; display:block; }
    
    .order-status {
      display: inline-flex; align-items: center; gap: .4rem;
      font-size: .85rem; font-weight: 800; text-transform: uppercase; letter-spacing: .05em;
      padding: .4rem 1rem; border-radius: var(--radius-full);
    }
    
    /* Specific statuses */
    .status-active     { background: rgba(14,165,233,0.1); color: #0284c7; border: 1px solid rgba(14,165,233,0.2); }
    .status-delivered  { background: rgba(16,185,129,0.1); color: #059669; border: 1px solid rgba(16,185,129,0.2); }
    .status-cancelled  { background: rgba(239,68,68,0.1); color: #dc2626; border: 1px solid rgba(239,68,68,0.2); }
    
    .order-items {
      border-top: 1px solid var(--border-light); padding-top: 1rem; margin-top: 1rem;
    }
    .order-item-row {
      display: flex; justify-content: space-between; margin-bottom: .5rem; font-size: .95rem; font-weight: 500;
    }
    .order-item-name { color: var(--ink); }
    .order-item-qty { color: var(--text-muted); font-size: .85rem; }
    
    .order-footer {
      display: flex; justify-content: space-between; align-items: center;
      border-top: 1px dashed var(--border); padding-top: 1rem; margin-top: 1rem;
    }
    .order-total { font-weight: 800; font-size: 1.25rem; color: var(--ink); }
    
    .no-orders { text-align: center; padding: 4rem 1rem; color: var(--ink-dim); }
    .no-orders .icon { font-size: 4rem; opacity: .5; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="loading-overlay hidden" id="loading-overlay">
    <div class="loading-box"><div class="spinner"></div><p>Fetching your orders…</p></div>
  </div>

  <nav class="navbar">
    <a href="/" class="navbar-brand">🍽 Canteen<span>Queue</span></a>
    <div class="navbar-nav">
      <div class="greet-chip" style="padding:.4rem 1rem;background:var(--surface-bg);border:1px solid var(--border);border-radius:99px;font-size:.9rem;font-weight:700;">👋 <span id="userName">Student</span></div>
      <a href="student-dashboard.html" class="btn btn-ghost btn-sm" style="font-weight:700">+ New Order</a>
      <button onclick="logout()" class="btn btn-outline btn-sm" style="border-radius:99px">Logout</button>
    </div>
  </nav>

  <div style="max-width:900px; margin:2rem auto; padding: 0 1.5rem;">
    <div class="page-header">
      <h2>My Orders 🧾</h2>
      <p>Keep track of all your past and active orders.</p>
    </div>

    <div id="ordersContainer">
      <!-- Orders will be injected here -->
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const user = requireAuth('student');
    if (user) document.getElementById('userName').textContent = user.name.split(' ')[0];

    const getStatusClass = (status) => {
      if (status === 'Delivered') return 'status-delivered';
      if (status === 'Cancelled') return 'status-cancelled';
      return 'status-active';
    };

    const renderOrders = (orders) => {
      const container = document.getElementById('ordersContainer');
      if (!orders || orders.length === 0) {
        container.innerHTML = `
          <div class="no-orders animate-fade-up">
            <div class="icon">🛒</div>
            <h3>No orders yet</h3>
            <p>You haven't placed any orders. Hungry?</p>
            <a href="student-dashboard.html" class="btn btn-primary mt-2">Browse Menu</a>
          </div>`;
        return;
      }

      // Group by date
      const grouped = {};
      orders.forEach(order => {
        const d = new Date(order.createdAt);
        // Format: 'Monday, April 6, 2026'
        const dateStr = d.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        if (!grouped[dateStr]) grouped[dateStr] = [];
        grouped[dateStr].push(order);
      });

      let html = '';
      for (const [dateStr, dayOrders] of Object.entries(grouped)) {
        html += `<div class="date-group animate-fade-up">
                   <div class="date-header">${dateStr}</div>`;
        
        dayOrders.forEach(order => {
          const d = new Date(order.createdAt);
          const timeStr = d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
          const isDone = ['Delivered', 'Cancelled'].includes(order.order_status);
          
          const itemsHtml = order.items.map(item => `
            <div class="order-item-row">
              <div><span class="order-item-name">${item.item_name}</span> <span class="order-item-qty">x${item.quantity}</span></div>
              <div>₹${item.price * item.quantity}</div>
            </div>
          `).join('');

          html += `
            <div class="order-card">
              <div class="order-header">
                <div>
                  <div class="order-token">🎟️ #${order.token_number}</div>
                  <span class="order-time">${timeStr}</span>
                </div>
                <div class="order-status ${getStatusClass(order.order_status)}">${order.order_status}</div>
              </div>
              
              <div class="order-items">
                ${itemsHtml}
              </div>
              
              <div class="order-footer">
                <div class="order-total">Total: ₹${order.total_price}</div>
                ${!isDone ? `<a href="order-confirmation.html?order=${order._id}" class="btn btn-primary btn-sm">Live Status →</a>` : ''}
              </div>
            </div>
          `;
        });
        
        html += `</div>`;
      }
      
      container.innerHTML = html;
    };

    const fetchOrders = async () => {
      showLoading();
      try {
        const res = await api.get('/order/my-orders');
        renderOrders(res.data);
      } catch (err) {
        toast('Failed to load orders', 'error');
      } finally {
        hideLoading();
      }
    };

    fetchOrders();
  </script>
</body>
</html>
