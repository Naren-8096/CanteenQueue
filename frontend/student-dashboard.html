<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Dashboard – CanteenQueue</title>
  <meta name="description" content="Browse today's canteen menu, add items to your cart, and place your order."/>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    /* ── PAGE TOKENS ── */

    /* Category Cards (Food App Style) */
    .cat-tabs { display:flex; gap:1.25rem; margin-bottom:2.5rem; overflow-x:auto; padding-bottom:1rem; -ms-overflow-style: none; scrollbar-width: none; }
    .cat-tabs::-webkit-scrollbar { display: none; }
    .cat-card {
      display: flex; flex-direction: column; align-items: center; gap: .65rem;
      background: transparent; border: none; cursor: pointer; min-width: 72px;
      transition: all var(--transition);
    }
    .cat-icon-wrap {
      width: 72px; height: 72px; border-radius: 50%;
      background: var(--surface); box-shadow: var(--shadow-sm);
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; border: 2px solid transparent;
      transition: all var(--transition);
    }
    .cat-card span {
      font-family: var(--font); font-size: .9rem; font-weight: 700; color: var(--ink-faint);
      transition: color var(--transition); white-space: nowrap;
    }
    .cat-card:hover .cat-icon-wrap { transform: translateY(-4px); box-shadow: var(--shadow-md); }
    .cat-card:hover span { color: var(--ink); }
    .cat-card.active .cat-icon-wrap { border-color: var(--accent); background: var(--accent-soft); box-shadow: var(--shadow-glow); }
    .cat-card.active span { color: var(--accent); }

    /* Queue-demand tag */
    .demand-tag {
      display:inline-flex; align-items:center; gap:.25rem;
      font-size:.75rem; font-weight:800;
      padding:.2rem .6rem;
      border-radius:var(--radius-full);
      background:var(--warning-soft);
      color:var(--warning);
      margin-top:.4rem;
      letter-spacing:.02em;
    }

    /* Image placeholder */
    .img-placeholder {
      width:100%; height:100%;
      display:flex; align-items:center; justify-content:center;
      font-size:3.5rem;
      background:var(--surface-2);
      user-select:none;
    }

    /* Cart total row */
    .cart-total-row {
      display:flex; justify-content:space-between; align-items:center;
      font-weight:800; font-size:1.1rem;
      padding:1.25rem 0;
      border-top:2px dashed var(--border);
      margin-top:.75rem;
    }
    .cart-total-row .total-label { color:var(--ink-faint); font-size:.9rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; }
    .cart-total-amount { font-size:1.4rem; color:var(--ink); }

    /* Empty cart */
    #cartEmpty { text-align:center; padding:3rem 1rem; color:var(--ink-dim); }
    #cartEmpty .e-icon { font-size:3rem; margin-bottom:1rem; opacity:.4; filter:grayscale(1); }
    #cartEmpty p { font-size:.95rem; font-weight:500; }

    /* Greet chip */
    .greet-chip {
      display:inline-flex; align-items:center; gap:.5rem;
      padding:.4rem 1rem;
      background:var(--surface-bg);
      border:1px solid var(--border);
      border-radius:var(--radius-full);
      font-size:.9rem; font-weight:700;
      color:var(--ink);
    }

    /* Section label */
    .section-label {
      font-size:.85rem; font-weight:800; text-transform:uppercase; letter-spacing:.1em;
      color:var(--ink-faint); margin-bottom:1rem; display:flex; align-items:center; gap:.5rem;
    }
    .section-label::before { content:''; display:inline-block; width:8px; height:8px; background:var(--accent); border-radius:50%; }

    /* Sidebar heading */
    .sidebar-heading {
      display:flex; align-items:center; justify-content:space-between;
      padding:2rem 2rem 1.5rem;
      border-bottom:1px solid var(--border-light);
    }
    .sidebar-heading h3 { font-size:1.25rem; font-weight:800; }
    .cart-count-chip {
      background:var(--accent); color:#fff;
      font-size:.8rem; font-weight:800;
      padding:.2rem .6rem; border-radius:var(--radius-full);
      min-width:26px; text-align:center; box-shadow:var(--shadow-glow);
    }

    /* Cart dynamic layout items */
    .cart-items-wrapper { padding: 0 1.5rem; flex:1; overflow-y:auto; }
    .cart-footer-wrapper { padding:1.5rem 2rem 2rem; background:var(--surface); border-top:1px solid var(--border-light); box-shadow:0 -4px 16px rgba(0,0,0,0.02); }

    /* Status live pill */
    .live-pill {
      display:inline-flex; align-items:center; gap:.4rem;
      font-size:.8rem; font-weight:800; text-transform:uppercase; letter-spacing:.05em;
      color:var(--success);
      background:var(--success-soft);
      padding:.3rem .9rem;
      border-radius:var(--radius-full);
      border:1px solid rgba(16,185,129,0.2);
    }
    .live-dot {
      width:8px; height:8px; border-radius:50%; background:var(--success);
      animation: pulse 2s ease infinite; box-shadow:0 0 8px var(--success);
    }

    /* Add to cart confirmation ripple  */
    .menu-card.just-added { animation: popIn .3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    
    /* Responsive tweaks */
    @media(max-width: 1024px) {
      .sidebar { height: auto; border-left:none; border-top:1px solid var(--border); }
      .cart-footer-wrapper { position:sticky; bottom:0; padding:1.5rem; }
    }

    /* Account Modal */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999; opacity: 1; transition: opacity .2s;
    }
    .modal-overlay.hidden { opacity: 0; pointer-events: none; }
    .modal-content {
      background: var(--surface); border-radius: var(--radius-lg);
      padding: 2.5rem; width: 90%; max-width: 500px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1); transform: scale(1);
      transition: transform .2s;
    }
    .modal-overlay.hidden .modal-content { transform: scale(0.95); }
  </style>
</head>
<body>
  <div class="loading-overlay hidden" id="loading-overlay">
    <div class="loading-box"><div class="spinner"></div><p>Loading the fresh menu…</p></div>
  </div>

  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="/" class="navbar-brand">🍽 Canteen<span>Queue</span></a>
    <div class="navbar-nav" style="display:flex; align-items:center; gap:.5rem;">
      <div class="greet-chip">👋 <span id="userName">Student</span></div>
      <a href="my-orders.html" class="btn btn-ghost btn-sm" style="font-weight:700">My Orders</a>
      <button onclick="openAccountSettings()" class="btn btn-outline btn-sm" style="border-radius:99px">⚙️ Account</button>
      <button onclick="logout()" class="btn btn-outline btn-sm" style="border-radius:99px">Logout</button>
    </div>
  </nav>

  <div class="layout-with-sidebar">

    <!-- ── MAIN: MENU ── -->
    <div class="main-area">

      <!-- Page header -->
      <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:1rem;margin-bottom:2rem;background:var(--surface);padding:2rem;border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);border:1px solid var(--border-light)">
        <div>
          <h2 style="margin-bottom:.4rem;font-size:2rem">What are we eating today? 😋</h2>
          <p style="font-size:1.05rem;font-weight:500">Pick your favourites and add them to the cart.</p>
        </div>
        <div id="menuStatus" class="live-pill">
          <span class="live-dot"></span> Menu Live
        </div>
      </div>

      <div class="section-label">Explore by category</div>
      <div class="cat-tabs" id="categoryTabs">
        <button class="cat-card active" data-cat="All">
          <div class="cat-icon-wrap">🔥</div><span>All Items</span>
        </button>
        <button class="cat-card" data-cat="Breakfast">
          <div class="cat-icon-wrap">🥞</div><span>Breakfast</span>
        </button>
        <button class="cat-card" data-cat="Lunch">
          <div class="cat-icon-wrap">🍛</div><span>Lunch</span>
        </button>
        <button class="cat-card" data-cat="Snacks">
          <div class="cat-icon-wrap">🍿</div><span>Snacks</span>
        </button>
        <button class="cat-card" data-cat="Beverages">
          <div class="cat-icon-wrap">☕</div><span>Beverages</span>
        </button>
      </div>

      <!-- Menu grid -->
      <div class="grid-3 animate-fade-up" id="menuGrid">
        <div class="empty-state"><div class="icon">🍽️</div><h3>Loading menu…</h3></div>
      </div>
    </div>

    <!-- ── SIDEBAR: CART ── -->
    <div class="sidebar">
      <div class="sidebar-heading">
        <h3>Your Cart</h3>
        <span class="cart-count-chip" id="cartCount">0</span>
      </div>

      <div class="cart-items-wrapper" id="cartItems">
        <div id="cartEmpty">
          <div class="e-icon">🛒</div>
          <p>Your cart is empty.<br/>Add some tasty items!</p>
        </div>
      </div>

      <div id="cartFooter" class="cart-footer-wrapper hidden">
        <div class="cart-total-row">
          <span class="total-label">Subtotal</span>
          <span class="cart-total-amount" id="cartTotal">₹0</span>
        </div>
        <button class="btn btn-accent btn-full btn-lg mt-2" onclick="proceedToCheckout()" style="font-size:1.15rem;font-weight:800;letter-spacing:0.02em">
          Checkout Now →
        </button>
        <button class="btn btn-ghost btn-full mt-2" onclick="clearCart()" style="color:var(--ink-faint);border-radius:99px">
          Clear Cart
        </button>
      </div>
    </div>
  </div>

  <!-- Account Settings Modal -->
  <div id="accountModal" class="modal-overlay hidden">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 1.5rem;">
        <h3 style="font-size: 1.5rem; font-weight: 800;">Account Settings</h3>
        <button onclick="closeAccountSettings()" style="background:transparent; border:none; font-size:1.8rem; cursor:pointer; color:var(--ink-dim); line-height:1;">&times;</button>
      </div>
      <form id="accountForm" onsubmit="handleAccountUpdate(event)">
        <div class="input-group">
          <label>Name</label>
          <input type="text" id="accName" class="input" required />
        </div>
        <div class="input-group" style="margin-top: 1rem;">
          <label>New Password (leave blank to keep current)</label>
          <input type="password" id="accPassword" class="input" placeholder="Min 6 characters" minlength="6" />
        </div>
        <button type="submit" class="btn btn-accent btn-full mt-4" style="margin-top: 2rem; font-size: 1.05rem; padding: 1rem;">Save Changes</button>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const user = requireAuth('student');
    if (user) document.getElementById('userName').textContent = user.name.split(' ')[0];

    let menuItems = [];
    let cart = JSON.parse(localStorage.getItem('cq_cart') || '[]');
    let itemQueueCounts = {};

    /* ── ACCOUNT SETTINGS ── */
    const openAccountSettings = () => {
      const modal = document.getElementById('accountModal');
      document.getElementById('accName').value = user.name;
      document.getElementById('accPassword').value = '';
      modal.classList.remove('hidden');
    };
    
    const closeAccountSettings = () => {
      document.getElementById('accountModal').classList.add('hidden');
    };

    const handleAccountUpdate = async (e) => {
      e.preventDefault();
      const name = document.getElementById('accName').value.trim();
      const password = document.getElementById('accPassword').value.trim();
      
      try {
        const body = { name };
        if (password) body.password = password;
        
        const res = await api.put('/auth/me', body);
        
        user.name = res.user.name;
        localStorage.setItem('cq_user', JSON.stringify(res.user));
        document.getElementById('userName').textContent = user.name.split(' ')[0];
        
        toast('Profile updated successfully!', 'success');
        closeAccountSettings();
        
        if (password) {
          toast('Password changed. Please log in again.', 'warning');
          setTimeout(() => logout(), 1500);
        }
      } catch (err) {
        toast(err.message, 'error');
      }
    };

    /* ── RENDER MENU ── */
    const renderMenu = (category = 'All') => {
      const grid  = document.getElementById('menuGrid');
      const items = category === 'All' ? menuItems : menuItems.filter(i => i.category === category);

      if (!items.length) {
        grid.innerHTML = '<div class="empty-state"><div class="icon">🍽️</div><h3>No items here</h3><p>Try a different category</p></div>';
        return;
      }

      const catEmoji = { Breakfast:'🥞', Lunch:'🍛', Snacks:'🍿', Beverages:'☕', Dinner:'🍽️' };

      grid.innerHTML = items.map(item => {
        const demand = itemQueueCounts[item._id] || 0;
        const demandTag = demand > 0
          ? `<div class="demand-tag">🔥 ${demand} waiting</div>`
          : '';
        const placeholder = catEmoji[item.category] || '🍴';
        const imgHtml = `
          <div class="menu-card-img-wrap">
            ${item.image_url 
              ? `<img src="${item.image_url}" alt="${item.item_name}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/>
                 <div class="img-placeholder" style="display:none">${placeholder}</div>`
              : `<div class="img-placeholder">${placeholder}</div>`}
          </div>`;

        return `
        <div class="menu-card ${!item.availability ? 'unavailable' : ''}" id="mc-${item._id}"
             onclick="${item.availability ? `addToCart('${item._id}','${item.item_name}',${item.price})` : ''}">
          ${imgHtml}
          <div class="menu-card-body">
            <div class="menu-card-name">${item.item_name}</div>
            <div class="menu-card-desc">${item.description || ''}</div>
            ${demandTag}
            <div class="menu-card-footer" style="margin-top:1rem">
              <span class="price">₹${item.price}</span>
              ${item.availability
                ? `<button class="btn-add">+ Add</button>`
                : `<span class="badge badge-neutral">Unavailable</span>`}
            </div>
          </div>
        </div>`;
      }).join('');
    };

    /* ── RENDER CART ── */
    const renderCart = () => {
      const container = document.getElementById('cartItems');
      const footer    = document.getElementById('cartFooter');
      const total     = cart.reduce((a,i) => a + i.price * i.qty, 0);
      document.getElementById('cartCount').textContent = cart.reduce((a,i) => a + i.qty, 0);

      if (!cart.length) {
        container.innerHTML = `<div id="cartEmpty"><div class="e-icon">🛒</div><p>Your cart is empty.<br/>Add some tasty items!</p></div>`;
        footer.classList.add('hidden');
        return;
      }

      footer.classList.remove('hidden');
      document.getElementById('cartTotal').textContent = `₹${total}`;

      container.innerHTML = cart.map((item, idx) => `
        <div class="cart-item">
          <div class="cart-item-name">${item.name}</div>
          <div class="qty-control">
            <button class="qty-btn" onclick="changeQty(${idx},-1)">−</button>
            <span class="qty-val">${item.qty}</span>
            <button class="qty-btn" onclick="changeQty(${idx},1)">+</button>
          </div>
          <div style="min-width:60px;text-align:right;font-weight:800;font-size:1.05rem;color:var(--ink)">₹${item.price * item.qty}</div>
        </div>`).join('');
    };

    /* ── CART ACTIONS ── */
    const addToCart = (id, name, price) => {
      const existing = cart.find(i => i.id === id);
      if (existing) existing.qty++;
      else cart.push({ id, name, price, qty: 1 });
      localStorage.setItem('cq_cart', JSON.stringify(cart));
      renderCart();
      // micro-animation
      const card = document.getElementById(`mc-${id}`);
      if (card) { card.classList.add('just-added'); setTimeout(() => card.classList.remove('just-added'), 350); }
      toast(`Added ${name} to cart!`, 'success');
    };

    const changeQty = (idx, delta) => {
      cart[idx].qty += delta;
      if (cart[idx].qty <= 0) cart.splice(idx, 1);
      localStorage.setItem('cq_cart', JSON.stringify(cart));
      renderCart();
    };

    const clearCart = () => {
      cart = [];
      localStorage.removeItem('cq_cart');
      renderCart();
    };

    const proceedToCheckout = () => {
      if (!cart.length) { toast('Your cart is empty.', 'error'); return; }
      window.location.href = '/checkout.html';
    };

    /* ── CATEGORY FILTER ── */
    document.getElementById('categoryTabs').addEventListener('click', e => {
      const btn = e.target.closest('.cat-card');
      if (btn) {
        document.querySelectorAll('.cat-card').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderMenu(btn.dataset.cat.replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]\s*/g, '')); // Strip emoji if any logic uses it
      }
    });

    /* ── INIT ── */
    (async () => {
      showLoading();
      try {
        const [menuRes, countRes] = await Promise.allSettled([
          api.get('/menu'),
          api.get('/queue/item-counts'),
        ]);
        if (menuRes.status === 'fulfilled') menuItems = menuRes.value.data;
        if (countRes.status === 'fulfilled') itemQueueCounts = countRes.value.data || {};
        renderMenu();
        renderCart();
      } catch (err) { toast('Failed to load menu.', 'error'); }
      finally { hideLoading(); }
    })();
  </script>
</body>
</html>
