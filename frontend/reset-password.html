<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password – CanteenQueue</title>
  <meta name="description" content="Set a new CanteenQueue password"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body class="hero-bg">
  <div class="loading-overlay hidden" id="loading-overlay">
    <div class="loading-box"><div class="spinner"></div><p>Resetting password…</p></div>
  </div>

  <div class="auth-page">
    <div class="card auth-card animate-fade-up">
      <div class="auth-logo">
        <a href="/" style="text-decoration:none;color:var(--text)"><h1>🍽️ Canteen<span style="color:var(--primary)">Queue</span></h1></a>
        <p style="margin-top:.5rem">Enter your new secure password.</p>
      </div>

      <form id="resetForm">
        <div style="display:flex;flex-direction:column;gap:1.25rem">
          <div class="input-group">
            <label for="password">New Password</label>
            <div style="position: relative;">
              <input id="password" type="password" class="input" placeholder="Min. 6 characters" required style="padding-right: 2.5rem; width: 100%;"/>
              <button type="button" id="togglePasswordBtn" style="position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 1.1rem; padding: 0; display: flex; align-items: center; justify-content: center;">
                <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-eye"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
          </div>
          <div id="errorMsg" class="error-msg hidden"></div>
          <button type="submit" class="btn btn-primary btn-full btn-lg" id="submitBtn">Update Password</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    if (!token) {
      document.getElementById('errorMsg').textContent = 'Invalid or missing reset token.';
      document.getElementById('errorMsg').classList.remove('hidden');
      document.getElementById('submitBtn').disabled = true;
    }

    // Toggle Password Visibility
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');
    if (togglePasswordBtn && passwordInput) {
      togglePasswordBtn.addEventListener('click', () => {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        if (type === 'password') {
          eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
        } else {
          eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
        }
      });
    }

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const errMsg = document.getElementById('errorMsg');
      const btn = document.getElementById('submitBtn');

      errMsg.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = 'Updating…';
      showLoading();

      try {
        const res = await api.put(`/auth/resetpassword/${token}`, { password });
        saveAuth(res.token, res.user);
        toast('Password updated successfully!', 'success');
        setTimeout(() => {
          const destination = (res.user.role === 'admin' || res.user.role === 'staff')
            ? '/admin-dashboard.html'
            : '/customer-dashboard.html';
          window.location.href = destination;
        }, 800);
      } catch (err) {
        errMsg.textContent = err.message;
        errMsg.classList.remove('hidden');
        hideLoading();
        btn.disabled = false;
        btn.textContent = 'Update Password';
      }
    });
  </script>
</body>
</html>
