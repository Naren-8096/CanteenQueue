<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Canteen Display – Token Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #131b2e;
      --card-border: #1e293b;
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --accent: #38bdf8;
      --success: #22c55e;
      --success-glow: rgba(34, 197, 94, 0.4);
      --warning: #f59e0b;
      --warning-glow: rgba(245, 158, 11, 0.3);
      --font: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font);
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* ── HEADER ── */
    header {
      background: rgba(19, 27, 46, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: .75rem;
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .brand span {
      color: var(--accent);
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: .25rem .75rem;
      border-radius: 99px;
      font-size: .8rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .4; transform: scale(0.85); }
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .clock {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .btn-header {
      background: #1e293b;
      border: 1px solid #334155;
      color: var(--text);
      padding: .4rem .9rem;
      border-radius: 8px;
      font-size: .85rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: .4rem;
      transition: all 0.2s;
    }

    .btn-header:hover {
      background: #334155;
    }

    /* ── MAIN BOARD ── */
    main {
      flex: 1;
      padding: 1.5rem 2rem;
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 2rem;
    }

    @media (max-width: 900px) {
      main {
        grid-template-columns: 1fr;
      }
    }

    .board-column {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 1.75rem;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .col-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--card-border);
    }

    .col-title {
      font-size: 1.4rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: .6rem;
    }

    .col-badge {
      padding: .3rem .8rem;
      border-radius: 99px;
      font-size: .85rem;
      font-weight: 800;
    }

    /* Ready Column Styles */
    .col-ready {
      border-color: rgba(34, 197, 94, 0.35);
      background: linear-gradient(180deg, rgba(34, 197, 94, 0.05) 0%, var(--card-bg) 100%);
    }

    .col-ready .col-title {
      color: #4ade80;
    }

    .col-ready .col-badge {
      background: var(--success);
      color: #000;
    }

    /* Preparing Column Styles */
    .col-prep {
      border-color: rgba(245, 158, 11, 0.3);
      background: linear-gradient(180deg, rgba(245, 158, 11, 0.04) 0%, var(--card-bg) 100%);
    }

    .col-prep .col-title {
      color: #fbbf24;
    }

    .col-prep .col-badge {
      background: var(--warning);
      color: #000;
    }

    /* Token Grids */
    .token-grid-ready {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1.25rem;
      flex: 1;
      align-content: start;
    }

    .token-grid-prep {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 1rem;
      flex: 1;
      align-content: start;
    }

    /* Token Card Ready */
    .token-card-ready {
      background: #192b21;
      border: 2px solid #22c55e;
      border-radius: 16px;
      padding: 1.25rem 1rem;
      text-align: center;
      box-shadow: 0 0 25px var(--success-glow);
      animation: readyPulse 2.5s infinite;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    @keyframes readyPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 20px var(--success-glow); }
      50% { transform: scale(1.03); box-shadow: 0 0 35px rgba(34, 197, 94, 0.6); }
    }

    .token-number-ready {
      font-size: 2.75rem;
      font-weight: 900;
      color: #4ade80;
      letter-spacing: -0.04em;
      line-height: 1;
      margin-bottom: .4rem;
    }

    .token-sub-ready {
      font-size: .8rem;
      font-weight: 800;
      color: #86efac;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    /* Token Card Prep */
    .token-card-prep {
      background: #252016;
      border: 1px solid #f59e0b;
      border-radius: 12px;
      padding: 1rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .token-number-prep {
      font-size: 2rem;
      font-weight: 900;
      color: #fbbf24;
      letter-spacing: -0.03em;
      line-height: 1;
      margin-bottom: .3rem;
    }

    .token-sub-prep {
      font-size: .75rem;
      font-weight: 700;
      color: #fde68a;
    }

    .empty-token-box {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-dim);
    }

    .empty-token-box .icon {
      font-size: 3rem;
      margin-bottom: .5rem;
      opacity: .5;
    }

    /* ── FOOTER BANNER ── */
    footer {
      background: #0f172a;
      border-top: 1px solid var(--card-border);
      padding: .85rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: .85rem;
      color: var(--text-dim);
    }
  </style>
</head>
<body>
  <!-- HEADER -->
  <header>
    <div class="brand">
      🍽️ Canteen<span>Queue</span>
      <div class="live-badge">
        <div class="live-dot"></div>
        Live Counter Display
      </div>
    </div>
    <div class="header-right">
      <div class="clock" id="liveClock">00:00:00</div>
      <button class="btn-header" id="soundBtn" onclick="toggleAudio()">🔊 Sound: ON</button>
      <button class="btn-header" onclick="toggleFullScreen()">⛶ Fullscreen</button>
    </div>
  </header>

  <!-- MAIN BOARD -->
  <main>
    <!-- READY FOR PICKUP COLUMN -->
    <div class="board-column col-ready">
      <div class="col-header">
        <div class="col-title">
          🔔 READY FOR PICKUP
        </div>
        <div class="col-badge" id="countReady">0 Orders</div>
      </div>
      <div class="token-grid-ready" id="readyGrid">
        <div class="empty-token-box">
          <div class="icon">✨</div>
          <p>No orders ready right now.</p>
        </div>
      </div>
    </div>

    <!-- PREPARING / QUEUE COLUMN -->
    <div class="board-column col-prep">
      <div class="col-header">
        <div class="col-title">
          🍳 NOW COOKING & QUEUE
        </div>
        <div class="col-badge" id="countPrep">0 Orders</div>
      </div>
      <div class="token-grid-prep" id="prepGrid">
        <div class="empty-token-box">
          <div class="icon">⏳</div>
          <p>All caught up!</p>
        </div>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    <div>📢 Please keep your <strong>4-digit OTP</strong> ready when your token appears in <strong>Ready for Pickup</strong>.</div>
    <div id="lastSync">Synced just now</div>
  </footer>

  <script>
    let soundEnabled = true;
    let knownReadyTokens = new Set();
    let isFirstLoad = true;

    // Clock
    const updateClock = () => {
      const now = new Date();
      document.getElementById('liveClock').textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    };
    setInterval(updateClock, 1000);
    updateClock();

    // Web Audio Chime Synthesizer
    const playBellChime = () => {
      if (!soundEnabled) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime); // A5
        osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.8);
        
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
        
        osc.connect(gain);
        gain.connect(ctx.destination);
        
        osc.start();
        osc.stop(ctx.currentTime + 0.8);
      } catch (_) {}
    };

    const toggleAudio = () => {
      soundEnabled = !soundEnabled;
      document.getElementById('soundBtn').textContent = soundEnabled ? '🔊 Sound: ON' : '🔇 Sound: OFF';
    };

    const toggleFullScreen = () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    };

    // Load active orders from backend
    const fetchQueueData = async () => {
      try {
        const res = await fetch('/api/queue');
        const data = await res.json();
        
        if (data.success && Array.isArray(data.data)) {
          renderDisplay(data.data);
          document.getElementById('lastSync').textContent = `Synced: ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
        }
      } catch (err) {
        console.error('Display sync failed:', err);
      }
    };

    const renderDisplay = (orders) => {
      const readyOrders = [];
      const prepOrders = [];

      orders.forEach(order => {
        const token = order.token_number;
        const status = order.status || order.order_status;

        if (status === 'ready' || status === 'Ready for Pickup') {
          readyOrders.push(order);
        } else if (status === 'preparing' || status === 'Preparing' || status === 'waiting' || status === 'In Queue') {
          prepOrders.push(order);
        }
      });

      // Check for newly ready orders to ring chime
      let hasNewReady = false;
      const currentReadyTokens = new Set();

      readyOrders.forEach(o => {
        currentReadyTokens.add(o.token_number);
        if (!isFirstLoad && !knownReadyTokens.has(o.token_number)) {
          hasNewReady = true;
        }
      });

      if (hasNewReady) {
        playBellChime();
      }

      knownReadyTokens = currentReadyTokens;
      isFirstLoad = false;

      // Update Counts
      document.getElementById('countReady').textContent = `${readyOrders.length} Ready`;
      document.getElementById('countPrep').textContent = `${prepOrders.length} In Progress`;

      // Render Ready Grid
      const readyGrid = document.getElementById('readyGrid');
      if (!readyOrders.length) {
        readyGrid.innerHTML = `
          <div class="empty-token-box">
            <div class="icon">✨</div>
            <p>No orders ready for pickup.</p>
          </div>`;
      } else {
        readyGrid.innerHTML = readyOrders.map(o => `
          <div class="token-card-ready">
            <div class="token-number-ready">#${o.token_number}</div>
            <div class="token-sub-ready">👉 Collect at Counter</div>
          </div>`).join('');
      }

      // Render Prep Grid
      const prepGrid = document.getElementById('prepGrid');
      if (!prepOrders.length) {
        prepGrid.innerHTML = `
          <div class="empty-token-box">
            <div class="icon">⏳</div>
            <p>No orders currently cooking.</p>
          </div>`;
      } else {
        prepGrid.innerHTML = prepOrders.map(o => `
          <div class="token-card-prep">
            <div class="token-number-prep">#${o.token_number}</div>
            <div class="token-sub-prep">${o.status === 'preparing' || o.order_status === 'Preparing' ? '🍳 Cooking' : '📋 In Queue'}</div>
          </div>`).join('');
      }
    };

    // Initial Fetch & Poll Loop
    fetchQueueData();
    setInterval(fetchQueueData, 3500);
  </script>
</body>
</html>
